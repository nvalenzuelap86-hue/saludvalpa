name: Vercel Deploy - SaludValpa

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SALUDVALPA }}
  NODE_VERSION: 18

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint code
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run tests (if available)
        run: |
          if [ -f "package.json" ] && grep -q '"test"' package.json; then
            npm test -- --passWithNoTests
          else
            echo "No test script found, skipping tests"
          fi

  deploy-preview:
    needs: build-and-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        id: deploy-preview
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-args: '--prod'
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_SALUDVALPA }}
          working-directory: .

  verify-preview:
    needs: deploy-preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install curl (for verification)
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Run deployment verification
        run: |
          # Get preview URL from deployment step
          DEPLOYMENT_URL="${{ needs.deploy-preview.outputs.preview-url }}"
          
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "Warning: No preview URL found, skipping verification"
            exit 0
          fi
          
          echo "Verifying preview deployment at: $DEPLOYMENT_URL"
          
          # Make verification script executable
          chmod +x scripts/verify-deployment.sh
          
          # Run verification (don't exit on failure for previews)
          ./scripts/verify-deployment.sh --url "$DEPLOYMENT_URL"
          
          echo "✅ Preview deployment verification completed"

      - name: Create preview verification report
        if: always()
        run: |
          echo "## Preview Deployment Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Preview URL:** ${{ needs.deploy-preview.outputs.preview-url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Verification Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Testing Instructions:" >> $GITHUB_STEP_SUMMARY
          echo "1. Visit the preview URL above to test your changes" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify all functionality works as expected" >> $GITHUB_STEP_SUMMARY
          echo "3. Report any issues in the PR comments" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        id: deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-args: '--prod'
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_SALUDVALPA }}
          working-directory: .
          alias-domains: |
            saludvalpa-app.vercel.app
            valpa.app
            www.valpa.app

      - name: Get deployment URL
        id: deployment-url
        run: |
          # Extract deployment URL from vercel-action output
          if [ -n "${{ steps.deploy.outputs.preview-url }}" ]; then
            echo "DEPLOYMENT_URL=${{ steps.deploy.outputs.preview-url }}" >> $GITHUB_OUTPUT
          else
            # Fallback to known production URL
            echo "DEPLOYMENT_URL=https://saludvalpa-app.vercel.app" >> $GITHUB_OUTPUT
          fi

  verify-production:
    needs: deploy-production
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install curl (for verification)
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Run deployment verification
        run: |
          DEPLOYMENT_URL="https://saludvalpa-app.vercel.app"
          echo "Verifying deployment at: $DEPLOYMENT_URL"
          
          # Make verification script executable
          chmod +x scripts/verify-deployment.sh
          
          # Run verification with exit on failure
          ./scripts/verify-deployment.sh --url "$DEPLOYMENT_URL" --exit-on-failure
          
          echo "✅ Deployment verification completed successfully"

      - name: Create verification report
        if: always()
        run: |
          echo "## Deployment Verification Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment URL:** https://saludvalpa-app.vercel.app" >> $GITHUB_STEP_SUMMARY
          echo "**Verification Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "- Visit https://saludvalpa-app.vercel.app to test the deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Check Vercel dashboard for detailed deployment logs" >> $GITHUB_STEP_SUMMARY
          echo "- Monitor application performance and errors" >> $GITHUB_STEP_SUMMARY